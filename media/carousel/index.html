<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jini Proof Carousel</title>
    <style>
      body {
        margin: 0;
        background: #efe9dd;
        color: #141414;
        font-family: Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 44px;
      }
      p {
        margin: 0 0 28px;
        font-size: 20px;
        line-height: 1.5;
        color: #5e584f;
      }
      .slides {
        display: grid;
        gap: 32px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 20px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jini Proof Carousel</h1>
      <p>
        Five social-ready proof slides built around the concrete status scene:
        tasks done, work still awaiting verification, approval still missing.
      </p>
      <div class="slides">
        <img src="./jini-proof-slide-1.svg" alt="Slide 1" />
        <img src="./jini-proof-slide-2.svg" alt="Slide 2" />
        <img src="./jini-proof-slide-3.svg" alt="Slide 3" />
        <img src="./jini-proof-slide-4.svg" alt="Slide 4" />
        <img src="./jini-proof-slide-5.svg" alt="Slide 5" />
      </div>
    </main>
  </body>
</html>
