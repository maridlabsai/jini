schema_version: "0.1.0"
benchmark_id: jini-product-golden-benchmark
label: Jini Golden Product Benchmark
updated_at: "2026-06-06"
last_verified_at: "2026-06-06"
purpose: >
  Validate Jini against a rerunnable golden dataset and compare it against the
  major product, harness, coding-agent, and UX competitors using weighted
  user-journey scenarios.
comparison_model:
  core_benchmark_set:
    - Claude Code
    - Codex
    - ChatGPT
    - Kiro
    - Hermes
    - AgentField
    - AI Hero
  watchlist:
    - Spec Kit
    - Windsurf
    - Cline
    - Aider
    - Matt Pocock Skills Installer
    - GitHub Copilot coding agent
    - Google Jules
    - Google Gemini CLI
    - Cursor
    - JetBrains Junie
    - Zed Agent Panel
    - Continue
    - OpenHands
    - Roomote
    - Devin
    - Factory Droids
    - Replit Agent
    - Lovable
    - Bolt.new
    - Vercel v0
    - Base44
    - Ollama
    - LM Studio
    - GPT4All
    - Jan
    - Open WebUI
    - AnythingLLM
    - LiteLLM
    - OpenRouter
    - Manus
    - Genspark Super Agent
    - Lindy
    - Zapier Agents
  rule: >
    The core benchmark set must align with the rerunnable competitor scenarios.
    Watchlist frameworks stay visible for product pressure and periodic review,
    but they do not require scenario coverage inside the golden benchmark.
scorecard_gates:
  commit_gate_command: ["scorecard-gate", "--format", "json"]
  minimum_core_competitors: 7
  minimum_watchlist_competitors: 30
  minimum_scenarios: 8
  required_watchlist_competitors:
    - claude-code
    - codex
    - github-copilot-coding-agent
    - google-jules
    - cursor
    - windsurf
    - cline
    - aider
    - continue
    - devin
    - replit-agent
  required_pressure_vectors:
    - id: async-background-agents
      competitors: [codex, github-copilot-coding-agent, google-jules, cursor, windsurf, devin]
      gate: >
        Each implementation cut must either improve asynchronous/background
        work visibility or leave a clear reason why it is not the next cut.
    - id: cross-surface-session-continuity
      competitors: [codex, chatgpt, cursor, github-copilot-coding-agent]
      gate: >
        Work state, outputs, and next actions must remain portable across CLI,
        desktop, mobile, and browser planning surfaces.
    - id: transparent-progress-and-outputs
      competitors: [codex, ai-hero, cursor, windsurf, replit-agent]
      gate: >
        Long-running work must show progress, produced artifacts, and review or
        steer points instead of hiding behind transcript-only status.
    - id: permissioned-sandbox-execution
      competitors: [codex, claude-code, github-copilot-coding-agent, devin]
      gate: >
        Tool execution must preserve visible permissions, recovery paths, and
        evidence before broader automation is promoted.
    - id: skills-hooks-and-context-routing
      competitors: [kiro, hermes, continue, cline, aider]
      gate: >
        Skills, hooks, steering, and routing must reduce repeated user work
        without expanding the beginner command surface.
    - id: local-open-model-optionality
      competitors: [aider, continue, cline, ollama, lm-studio, open-webui, litellm]
      gate: >
        Local and open-model routes must stay visible in auto-mode decisions
        while preserving privacy and offline-readiness evidence.
    - id: commit-gated-scorecard-drift
      competitors: [claude-code, codex, github-copilot-coding-agent, google-jules, cursor, windsurf]
      gate: >
        Scorecard coverage must run in the commit gate so competitor pressure
        cannot become stale planning prose.
methodology:
  benchmark_scope: internal-drift-benchmark-not-live-market-ranking
  baseline_type: fixed-competitor-baselines-grounded-in-official-docs
  scoring_rule: >
    Each scenario starts from the current KPI-backed Jini score for its listed
    dimensions, then multiplies that base by a validation factor derived from
    real CLI check pass rate. Competitor scores stay fixed inside the golden
    dataset so repeated runs measure Jini drift instead of moving the
    goalposts. This means the benchmark is useful for regression detection, but
    it must not be treated as a live external market ranking.
  command_rule: >
    `command` entries are runnable checks against the current native Go CLI.
    Pre-migration or not-yet-ported checks must use `backlog_command` until the
    command graduates through the public command-surface and publish-readiness
    gates.
  comparison_rule: >
    Claude Code is the terminal immediacy baseline. Kiro is the productized
    workflow and delivery baseline. Hermes is the memory, breadth, and autonomy
    baseline. AgentField is the production harness-orchestration baseline. AI
    Hero is the low-friction learning, tool-transparency, and human-in-the-loop
    UX baseline. The benchmark favors rerunnable product behaviors over
    README-only claims.
  track_rule: >
    The benchmark reports two explicit score tracks. `architecture-strength`
    captures protocol rigor, governance, install, portability, and breadth.
    `adoption-truth` captures first-minute clarity, cheap-default posture,
    guided-loop smoothness, and friction-reduction proxies. Jini should be
    allowed to lead on architecture while still trailing on adoption if the
    product has not yet earned parity there.
  bias_controls:
    - Competitor scores are fixed reference baselines, so the benchmark can flatter Jini if the market has moved since the last benchmark refresh.
    - Adoption-heavy scenarios intentionally use tougher competitor baselines than architecture scenarios.
    - Overall score is less important than track-level honesty; use `adoption-truth` as the harsher read.
    - Prefer checks that penalize product theory leakage, extra control decisions, and weak cheap-default behavior.
  interpretation_warning: >
    A green benchmark does not prove Jini is currently better than Claude,
    Codex, ChatGPT, or other competitors in real usage. It proves only that
    Jini is internally consistent and strong against this fixed golden dataset.
competitors:
  - id: claude-code
    label: Claude Code
    rationale: Strongest benchmark for terminal-native immediacy and direct developer action.
    source_urls:
      - https://docs.claude.com/en/docs/claude-code/overview
      - https://claude.com/product/claude-code
    validated_strengths:
      - Starts from natural-language intent in the terminal
      - Directly edits files, runs commands, and creates commits
      - Composable Unix-style CLI surface
  - id: codex
    label: Codex
    rationale: Strongest benchmark for cross-surface coding continuity and approval-aware remote execution.
    source_urls:
      - https://platform.openai.com/docs/codex
      - https://openai.com/index/work-with-codex-from-anywhere/
    validated_strengths:
      - Natural task intake across local and remote coding surfaces
      - Continuation, approvals, and review loops across devices
      - Strong coding-task portability and active-work continuity
  - id: chatgpt
    label: ChatGPT
    rationale: Strongest benchmark for conversational first-run clarity, projects, and editable artifact surfaces.
    source_urls:
      - https://help.openai.com/en/articles/10169521-using-projects-in-chatgpt
      - https://help.openai.com/en/articles/9930697-what-is-the-canvas-feature-in-chatgpt-and-how-do-i-use-it
    validated_strengths:
      - Conversational first turn with low setup pressure
      - Persistent project context and files
      - Rich edit surfaces for revision-heavy work
  - id: kiro
    label: Kiro
    rationale: Strongest benchmark for workflow productization and default delivery loop quality.
    source_urls:
      - https://kiro.dev/docs/specs/
      - https://kiro.dev/docs/steering/
      - https://kiro.dev/docs/cli/hooks/
    validated_strengths:
      - Structured spec-first workflow and task execution
      - Persistent workspace steering
      - Lifecycle hooks for operator automation
  - id: hermes
    label: Hermes
    rationale: Strongest benchmark for memory, autonomy, and breadth-as-product feel.
    source_urls:
      - https://hermes-agent.nousresearch.com/docs/user-guide/features/overview/
      - https://hermes-agent.nousresearch.com/docs/user-guide/features/memory/
      - https://hermes-agent.nousresearch.com/docs/guides/work-with-skills/
    validated_strengths:
      - Persistent bounded memory across sessions
      - Bundled skills with progressive disclosure
      - Breadth and automation as a daily product surface
  - id: agentfield
    label: AgentField
    rationale: Strongest benchmark for treating coding-agent harnesses as production infrastructure.
    source_urls:
      - https://github.com/Agent-Field/agentfield
      - https://agentfield.ai/blog/what-is-harness-orchestration
      - https://agentfield.ai/examples
    validated_strengths:
      - Coding agents exposed as callable backend primitives
      - Harness orchestration for Claude Code, Codex, and Gemini CLI
      - Production concepts including identity, observability, rollout, and scale
  - id: ai-hero
    label: AI Hero
    rationale: Strongest benchmark for transparent tool-call teaching and low-friction human-in-the-loop UX.
    source_urls:
      - https://www.aihero.dev/workshops/day-1-build-a-naive-agent
      - https://www.aihero.dev/workshops/human-in-the-loop-skill-building-xlo4o
      - https://aihero.studio/documentation
    validated_strengths:
      - Teaches visible tool calls, arguments, results, and sources
      - Human approval before sensitive real-world action
      - Simple agent creation and voice-first daily task capture
scenarios:
  - id: install-trust
    label: Beginner install trust path
    purpose: A new user should see one obvious trust path before bundle-level detail.
    weight: 1.7
    tracks:
      - adoption-truth
      - architecture-strength
    dimensions:
      - packaging-install
      - delivery-maturity
    competitor_scores:
      claude-code: 8.8
      codex: 8.6
      chatgpt: 8.2
      kiro: 8.9
      hermes: 7.2
      agentfield: 7.0
      ai-hero: 8.4
    setup:
      - id: install-starter-kit
        backlog_command:
          [
            "install-bundles",
            "--kit",
            "starter-kit",
            "--target",
            "codex",
            "--prefix",
            "{scenario_root}/prefix",
          ]
    checks:
      - id: beginner-trust-preview
        backlog_command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.trust_path.0.id"
        equals: "preview"
      - id: beginner-notes-demote-bundle-overload
        backlog_command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.notes.0"
        contains: "Bundle-level detail"
      - id: catalog-beginner-kit
        backlog_command: ["catalog-bundles", "--format", "json"]
        path: "recommended_paths.beginner.kit_id"
        equals: "starter-kit"
      - id: plan-install-next-step-verify
        backlog_command: ["plan-install", "--target", "codex", "--format", "json"]
        path: "recommended_next_steps.1.id"
        equals: "verify"
      - id: doctor-install-runs-plan-probe
        backlog_command:
          ["doctor-install", "--kit", "starter-kit", "--target", "codex", "--prefix", "{scenario_root}/prefix", "--format", "json"]
        path: "checks.0.health_checks"
        contains: "smoke-plan-install"
      - id: doctor-install-runs-resolve-adapter-probe
        backlog_command:
          ["doctor-install", "--kit", "starter-kit", "--target", "codex", "--prefix", "{scenario_root}/prefix", "--format", "json"]
        path: "checks.0.health_checks"
        contains: "smoke-resolve-adapter"

  - id: cheap-default-loop
    label: Cheap default resume loop
    purpose: Low-cost execution should be the obvious path when the intent allows it.
    weight: 1.6
    tracks:
      - adoption-truth
    dimensions:
      - token-efficiency
      - delivery-maturity
    competitor_scores:
      claude-code: 8.7
      codex: 8.8
      chatgpt: 7.6
      kiro: 8.3
      hermes: 7.1
      agentfield: 7.5
      ai-hero: 7.7
    setup:
      - id: compile-research-pack
        backlog_command:
          [
            "compile-pack",
            "research-prd",
            "--work-unit-id",
            "golden-research",
            "--title",
            "Golden Research",
            "--purpose",
            "Golden benchmark research pack",
            "--owner",
            "benchmark-owner",
            "--approver",
            "benchmark-approver",
            "--output",
            "{scenario_root}/research-pack",
          ]
    checks:
      - id: recommend-export-is-cheap
        backlog_command: ["recommend-execution", "{scenario_root}/research-pack", "--intent", "export", "--format", "json"]
        path: "execution_class"
        equals: "cheap"
      - id: resume-stays-bounded
        backlog_command:
          [
            "resume",
            "{scenario_root}/research-pack",
            "--intent",
            "export",
            "--max-chars",
            "900",
            "--format",
            "json",
          ]
        path: "token_budget.estimated_chars"
        maximum: 900
      - id: resume-efficiency-posture-is-cheap
        backlog_command:
          [
            "resume",
            "{scenario_root}/research-pack",
            "--intent",
            "export",
            "--max-chars",
            "900",
            "--format",
            "json",
          ]
        path: "efficiency_posture.execution_class"
        equals: "cheap"
      - id: resume-efficiency-rationale-is-visible
        backlog_command:
          [
            "resume",
            "{scenario_root}/research-pack",
            "--intent",
            "export",
            "--max-chars",
            "900",
            "--format",
            "json",
          ]
        path: "efficiency_posture.rationale"
        contains: "Intent `export` defaults to `cheap` execution"
      - id: resume-runtime-readout-route-visible
        backlog_command:
          [
            "resume",
            "{scenario_root}/research-pack",
            "--intent",
            "export",
            "--max-chars",
            "900",
            "--format",
            "json",
          ]
        path: "runtime_readout.route"
        contains: "codex"
      - id: resume-runtime-readout-effort-visible
        backlog_command:
          [
            "resume",
            "{scenario_root}/research-pack",
            "--intent",
            "export",
            "--max-chars",
            "900",
            "--format",
            "json",
          ]
        path: "runtime_readout.effort"
        equals: "cheap"
      - id: status-shows-working-with-input-item
        backlog_command: ["status", "{scenario_root}/research-pack", "--format", "json"]
        path: "working_with.input_items.0.input_id"
        equals: "initial-request"
      - id: status-turn-record-links-input-item
        backlog_command: ["status", "{scenario_root}/research-pack", "--format", "json"]
        path: "turn_record.user_input_ids"
        contains: "initial-request"
      - id: status-input-extraction-summary-visible
        backlog_command: ["status", "{scenario_root}/research-pack", "--format", "json"]
        path: "working_with.input_items.0.extraction_summary"
        contains: "Captured text request"
      - id: status-shows-grouped-artifact-shelf
        backlog_command: ["status", "{scenario_root}/research-pack", "--format", "json"]
        path: "artifact_shelf.ready_now.label"
        equals: "Ready now"
      - id: status-artifact-card-is-openable
        backlog_command: ["status", "{scenario_root}/research-pack", "--format", "json"]
        path: "artifact_shelf.ready_now.cards.0.open_action.command"
        contains: "jini open"

  - id: portable-edges
    label: Portable execution edges
    purpose: Runtime, issue, and wiki edges should be visible through one canonical contract.
    weight: 1.7
    tracks:
      - architecture-strength
    dimensions:
      - adapter-portability
      - delivery-maturity
    competitor_scores:
      claude-code: 6.5
      codex: 7.8
      chatgpt: 5.9
      kiro: 6.8
      hermes: 7.4
      agentfield: 8.6
      ai-hero: 5.8
    checks:
      - id: adapter-conformance-clean
        backlog_command: ["adapter-conformance", "--format", "json"]
        path: "status"
        equals: "ok"
      - id: runtime-activate-capability
        backlog_command: ["adapter-matrix", "--format", "json"]
        path: "capabilities.runtime-activate"
        contains: "codex"
      - id: issue-bridge-capability
        backlog_command: ["adapter-matrix", "--format", "json"]
        path: "capabilities.issues-execute-bridge"
        contains: "jira"
      - id: wiki-local-apply-capability
        backlog_command: ["adapter-matrix", "--format", "json"]
        path: "capabilities.wiki-apply-local"
        contains: "markdown"

