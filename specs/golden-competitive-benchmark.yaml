  - id: first-minute-adoption
    label: First-minute adoption truth
    purpose: The benchmark should punish Jini when first-run clarity and low-friction adoption still lag stronger everyday products.
    weight: 1.9
    tracks:
      - adoption-truth
    dimensions:
      - delivery-maturity
      - token-efficiency
      - core-simplicity
    competitor_scores:
      claude-code: 9.3
      codex: 9.2
      chatgpt: 9.1
      kiro: 8.8
      hermes: 8.3
      agentfield: 7.4
      ai-hero: 8.9
    checks:
      - id: friction-reduction-section-present
        command: ["publish-readiness", "--format", "json"]
        path: "sections"
        contains: "friction-reduction"
      - id: beginner-path-is-single-command
        command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.commands"
        equals: ["jini"]
      - id: beginner-path-hides-bundle-detail
        command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.notes.0"
        contains: "Bundle-level detail is intentionally hidden"
      - id: framework-review-prefers-subtractive-adoption-pressure
        command: ["review-framework", "--format", "json", "--limit", "3"]
        path: "adoption_constraints"
        contains: "removed, demoted, or consolidated"

  - id: product-consensus-gates
    label: Product consensus replacement gates
    purpose: Publish-readiness must prove the replacement-critical launcher shape is bounded, useful-first, continuable, and parity-safe.
    weight: 1.9
    tracks:
      - architecture-strength
    dimensions:
      - workflow-rigor
      - delivery-maturity
      - governance
      - core-simplicity
    competitor_scores:
      claude-code: 8.1
      codex: 8.0
      chatgpt: 7.6
      kiro: 7.1
      hermes: 7.1
      agentfield: 7.9
      ai-hero: 6.9
    checks:
      - id: product-review-role-docs-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "product-review-role-docs"
      - id: cross-critic-convergence-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "cross-critic-convergence"
      - id: two-flagship-replacement-flows-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "two-flagship-replacement-flows"
      - id: useful-result-first-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "useful-result-first"
      - id: i-am-not-sure-fallback-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "i-am-not-sure-fallback"
      - id: real-continuation-actions-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "real-continuation-actions"
      - id: parity-or-shared-generation-gate
        command: ["publish-readiness", "--format", "json"]
        path: "consensus_gates.passed_gate_ids"
        contains: "parity-or-shared-generation"

  - id: operational-breadth
    label: Operational advanced-set breadth
    purpose: Breadth should be operational through packs and routines, not just claimed in docs.
    weight: 1.5
    tracks:
      - architecture-strength
    dimensions:
      - advanced-set-breadth
      - flexibility
    competitor_scores:
      claude-code: 7.8
      codex: 8.1
      chatgpt: 7.0
      kiro: 7.2
      hermes: 8.9
      agentfield: 8.8
      ai-hero: 7.2
    setup:
      - id: bootstrap-home
        command: ["bootstrap-home", "{scenario_root}/home", "--owner-name", "Golden User"]
    checks:
      - id: pack-catalog-count
        command: ["catalog-packs", "--format", "json"]
        path: "pack_count"
        minimum: 7
      - id: vendor-pack-present
        command: ["catalog-packs", "--format", "json"]
        path: "packs"
        contains: "vendor-selection"
      - id: publish-readiness-routine-present
        command: ["list-routines", "{scenario_root}/home", "--format", "json"]
        path: "routines"
        contains: "publish-readiness"
      - id: golden-benchmark-routine-executes
        command: ["run-routine", "{scenario_root}/home", "golden-benchmark", "--mode", "local", "--format", "json"]
        path: "status"
