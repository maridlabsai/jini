            "{scenario_root}/research-pack",
            "--mode",
            "supervised",
            "--intent",
            "publish",
            "--home",
            "{scenario_root}/home",
            "--runtime-target",
            "codex",
            "--activate-runtime",
            "--prefix",
            "{scenario_root}/prefix",
            "--consent",
            "write",
            "--consent",
            "publish",
            "--issue-adapter",
            "github",
            "--wiki-adapter",
            "markdown",
