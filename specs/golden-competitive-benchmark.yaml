  - id: first-minute-adoption
    label: First-minute adoption truth
    purpose: The benchmark should punish Jini when first-run clarity and low-friction adoption still lag stronger everyday products.
    weight: 1.9
    tracks:
      - adoption-truth
    dimensions:
      - delivery-maturity
      - token-efficiency
      - core-simplicity
    competitor_scores:
      claude-code: 9.3
      codex: 9.2
      chatgpt: 9.1
      kiro: 8.8
      hermes: 8.3
      agentfield: 7.4
      ai-hero: 8.9
    checks:
      - id: friction-reduction-section-present
        backlog_command: ["publish-readiness", "--format", "json"]
        path: "sections"
        contains: "friction-reduction"
      - id: beginner-path-is-single-command
        backlog_command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.commands"
        equals: ["jini"]
      - id: beginner-path-hides-bundle-detail
        backlog_command: ["get-started", "--target", "codex", "--format", "json"]
        path: "beginner_path.notes.0"
        contains: "Bundle-level detail is intentionally hidden"
      - id: framework-review-prefers-subtractive-adoption-pressure
        backlog_command: ["review-framework", "--format", "json", "--limit", "3"]
        path: "adoption_constraints"
