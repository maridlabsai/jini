            "research-prd",
            "--work-unit-id",
            "golden-guided-loop",
            "--title",
            "Golden Guided Loop",
            "--purpose",
            "Golden benchmark guided publish loop",
            "--owner",
            "benchmark-owner",
            "--approver",
            "benchmark-approver",
            "--output",
            "{scenario_root}/research-pack",
          ]
      - id: bootstrap-home
        command: ["bootstrap-home", "{scenario_root}/home", "--owner-name", "Golden User"]
    checks:
      - id: guided-loop-activates-runtime
        command:
          [
            "run",
            "{scenario_root}/research-pack",
            "--mode",
            "supervised",
            "--intent",
            "publish",
            "--home",
            "{scenario_root}/home",
            "--runtime-target",
            "codex",
            "--activate-runtime",
            "--prefix",
            "{scenario_root}/prefix",
            "--consent",
            "write",
            "--consent",
            "publish",
            "--issue-adapter",
            "github",
            "--wiki-adapter",
            "markdown",
            "--format",
            "json",
          ]
        path: "flow_steps"
        contains: "activate-runtime-target"
      - id: guided-loop-applies-local-publish
        command:
          [
            "run",
            "{scenario_root}/research-pack",
            "--mode",
            "supervised",
            "--intent",
            "publish",
            "--home",
            "{scenario_root}/home",
            "--runtime-target",
            "codex",
            "--activate-runtime",
            "--prefix",
            "{scenario_root}/prefix",
            "--consent",
            "write",
            "--consent",
            "publish",
            "--issue-adapter",
            "github",
            "--wiki-adapter",
            "markdown",
            "--format",
            "json",
          ]
        path: "flow_steps"
        contains: "apply-publish-plan"
      - id: guided-loop-selects-codex-runtime
        command:
          [
            "run",
            "{scenario_root}/research-pack",
            "--mode",
            "supervised",
            "--intent",
            "publish",
            "--home",
            "{scenario_root}/home",
            "--runtime-target",
            "codex",
            "--activate-runtime",
            "--prefix",
            "{scenario_root}/prefix",
            "--consent",
            "write",
            "--consent",
            "publish",
            "--issue-adapter",
            "github",
            "--wiki-adapter",
            "markdown",
            "--format",
            "json",
          ]
        path: "runtime_activation.runtime_target"
        equals: "codex"
      - id: guided-loop-produces-local-receipts
        command:
          [
            "run",
            "{scenario_root}/research-pack",
            "--mode",
            "supervised",
            "--intent",
            "publish",
            "--home",
            "{scenario_root}/home",
            "--runtime-target",
            "codex",
            "--activate-runtime",
            "--prefix",
            "{scenario_root}/prefix",
            "--consent",
            "write",
            "--consent",
            "publish",
            "--issue-adapter",
            "github",
            "--wiki-adapter",
            "markdown",
            "--format",
            "json",
          ]
        path: "local_publish_receipts"
        contains: "applied-local"
      - id: guided-loop-reuses-handoff-context
