            "golden-guided-loop",
            "--title",
            "Golden Guided Loop",
            "--purpose",
            "Golden benchmark guided publish loop",
            "--owner",
            "benchmark-owner",
            "--approver",
            "benchmark-approver",
            "--output",
            "{scenario_root}/research-pack",
