name: Installer And Go CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  installer-and-go:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Show tool versions
        shell: bash
        run: |
          go version
          git --version

      - name: Lint installer shell syntax
        shell: bash
        run: bash -n install.sh

      - name: Run Go test suite
        shell: bash
        run: go test ./...

      - name: Run CLI latency benchmark smoke
        shell: bash
        run: go test ./internal/app -run '^$' -bench 'BenchmarkInteractive(NoWorkHelp|CurrentWorkReadyShelf)$' -benchmem -benchtime=50x

      - name: Smoke local Go source installer
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          ./install.sh --source-dir "${PWD}" --bin-dir "${tmp}/bin" --install-dir "${tmp}/install" --force
          "${tmp}/bin/jini" commands >/dev/null
          test -f "${tmp}/install/install-receipt.txt"

      - name: Smoke piped release installer from checkout
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          case "$(uname -s)" in
            Darwin) os_name="darwin" ;;
            Linux) os_name="linux" ;;
            *) echo "unsupported smoke OS" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch_name="amd64" ;;
            arm64|aarch64) arch_name="arm64" ;;
            *) echo "unsupported smoke arch" >&2; exit 1 ;;
          esac
          mkdir -p "${tmp}/release" "${tmp}/package"
          go build -o "${tmp}/package/jini" ./cmd/jini
          tar -czf "${tmp}/release/jini-${os_name}-${arch_name}.tar.gz" -C "${tmp}/package" jini
          cat install.sh | \
            JINI_RELEASE_BASE_URL="file://${tmp}/release" \
            JINI_GO_BIN="${tmp}/missing-go" \
            JINI_BIN_DIR="${tmp}/bin" \
            JINI_INSTALL_DIR="${tmp}/install" \
            bash
          "${tmp}/bin/jini" commands >/dev/null
          grep -q '^install_mode=release-binary$' "${tmp}/install/install-receipt.txt"
          grep -q "^version=$(tr -d '[:space:]' < VERSION)$" "${tmp}/install/install-receipt.txt"
