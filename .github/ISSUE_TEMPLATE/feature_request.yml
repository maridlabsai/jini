name: Feature request
description: Propose a meaningful improvement to Jini
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain or gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change as concretely as possible
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why this fits Jini
      description: Explain whether this belongs in the core, a pack, an adapter, or docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
