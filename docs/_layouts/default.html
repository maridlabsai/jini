<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <header class="site-shell-header">
        <a class="site-brand site-brand-link" href="{{ '/' | relative_url }}" aria-label="Jini home">
          <img class="site-brand-mark" src="{{ '/assets/brand/jini-mark-512.png' | relative_url }}" alt="Jini mark">
          <div class="site-brand-copy">
            <span class="site-brand-label">Jini</span>
            <p class="site-brand-tagline">The framework for week two of work.</p>
          </div>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/simple.html' | relative_url }}">Simple Guide</a>
          <a href="{{ '/examples.html' | relative_url }}">Examples</a>
          <a href="{{ '/install.html' | relative_url }}">Install</a>
          <a href="{{ '/proof.html' | relative_url }}">Proof</a>
          <a href="{{ '/contact.html' | relative_url }}">Contact</a>
        </nav>
      </header>

      {% unless page.url == '/' %}
      <p class="site-section-label">Jini</p>
      <h1 class="site-page-title">{{ page.title }}</h1>
      {% if page.description %}
      <p class="site-page-description">{{ page.description }}</p>
      {% endif %}
      {% endunless %}

      {{ content }}
    </div>
  </body>
</html>
