<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Jini output storyboard</title>
  <desc id="desc">A storyboard showing three sendable artifacts from Jini: a meeting follow-up, a readiness check, and a decision memo.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f2fbf8"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <rect x="54" y="50" width="1492" height="660" rx="30" fill="#ffffff" opacity="0.74"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="94" y="116" font-size="22" font-weight="700" letter-spacing="1.6" fill="#0f766e">SENDABLE ARTIFACTS</text>
    <text x="94" y="174" font-size="54" font-weight="700" fill="#0f172a">What leaves the thread</text>
    <text x="94" y="218" font-size="25" fill="#475569">Follow-up, readiness check, and recommendation memo with enough context attached to survive handoff.</text>
  </g>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="278" width="430" height="360" rx="30" fill="url(#panelA)"/>
    <rect x="585" y="278" width="430" height="360" rx="30" fill="url(#panelB)"/>
    <rect x="1078" y="278" width="430" height="360" rx="30" fill="url(#panelC)"/>

    <rect x="122" y="310" width="152" height="32" rx="16" fill="#dbeafe"/>
    <text x="151" y="331" font-size="16" font-weight="700" fill="#1d4ed8">AFTER THE MEETING</text>
    <text x="122" y="382" font-size="34" font-weight="700" fill="#0f172a">Follow-up</text>
    <text x="122" y="424" font-size="20" fill="#475569">owners, decisions, open questions</text>
    <rect x="122" y="462" width="272" height="116" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="148" y="500" font-size="18" fill="#0f172a">Owner list</text>
    <text x="148" y="534" font-size="18" fill="#475569">Decision summary</text>
    <text x="148" y="568" font-size="18" fill="#475569">What still needs reply</text>

    <rect x="615" y="310" width="168" height="32" rx="16" fill="#ccfbf1"/>
    <text x="646" y="331" font-size="16" font-weight="700" fill="#0f766e">BEFORE HANDOFF</text>
    <text x="615" y="382" font-size="34" font-weight="700" fill="#0f172a">Readiness check</text>
    <text x="615" y="424" font-size="20" fill="#475569">ready, missing, still risky</text>
    <rect x="615" y="462" width="290" height="116" rx="22" fill="#ffffff" stroke="#ccfbf1"/>
    <text x="641" y="500" font-size="18" fill="#0f172a">What is safe to build now</text>
    <text x="641" y="534" font-size="18" fill="#475569">What still blocks the handoff</text>
    <text x="641" y="568" font-size="18" fill="#475569">Why the missing pieces matter</text>

    <rect x="1108" y="310" width="168" height="32" rx="16" fill="#e0e7ff"/>
    <text x="1140" y="331" font-size="16" font-weight="700" fill="#4f46e5">BEFORE DECISION</text>
    <text x="1108" y="382" font-size="34" font-weight="700" fill="#0f172a">Recommendation memo</text>
    <text x="1108" y="424" font-size="20" fill="#475569">tradeoffs still attached</text>
    <rect x="1108" y="462" width="284" height="116" rx="22" fill="#ffffff" stroke="#e0e7ff"/>
    <text x="1134" y="500" font-size="18" fill="#0f172a">Recommendation</text>
    <text x="1134" y="534" font-size="18" fill="#475569">Tradeoff table</text>
    <text x="1134" y="568" font-size="18" fill="#475569">Questions still open</text>
  </g>
</svg>
