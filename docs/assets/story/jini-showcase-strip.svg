<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Jini showcase storyboard</title>
  <desc id="desc">A storyboard showing rough input entering Jini in the CLI, continuing across desktop and mobile, and leaving as a sendable artifact.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f7fffd"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <rect x="42" y="42" width="1516" height="676" rx="30" fill="#ffffff" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="78" y="104" width="430" height="520" rx="32" fill="url(#hero)"/>
    <rect x="585" y="148" width="430" height="420" rx="32" fill="#ffffff"/>
    <rect x="1092" y="124" width="430" height="470" rx="32" fill="#ffffff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="156" font-size="20" font-weight="700" letter-spacing="1.8" fill="#93c5fd">LIVE NOW</text>
    <text x="110" y="208" font-size="46" font-weight="700" fill="#f8fafc">CLI thread</text>
    <text x="110" y="248" font-size="23" fill="#cbd5e1">rough input to usable next artifact</text>

    <rect x="110" y="286" width="366" height="168" rx="22" fill="#020617" opacity="0.72"/>
    <text x="136" y="328" font-size="18" fill="#94a3b8">$ jini</text>
    <text x="136" y="368" font-size="18" fill="#e2e8f0">notes + transcript + screenshots</text>
    <text x="136" y="404" font-size="18" fill="#e2e8f0">route evidence visible</text>
    <text x="136" y="440" font-size="18" fill="#e2e8f0">follow-up draft ready to send</text>

    <rect x="110" y="488" width="160" height="38" rx="19" fill="#1d4ed8"/>
    <text x="145" y="513" font-size="17" font-weight="700" fill="#ffffff">installable today</text>

    <rect x="585" y="104" width="190" height="34" rx="17" fill="#d1fae5"/>
    <text x="617" y="126" font-size="16" font-weight="700" fill="#0f766e">NEXT SURFACES</text>
    <text x="617" y="194" font-size="40" font-weight="700" fill="#0f172a">Continuity</text>
    <text x="617" y="232" font-size="22" fill="#475569">desktop and mobile when live</text>

    <rect x="617" y="272" width="366" height="102" rx="22" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="645" y="314" font-size="18" fill="#0f172a">same session identity</text>
    <text x="645" y="348" font-size="18" fill="#475569">same artifact focus</text>
    <text x="645" y="382" font-size="18" fill="#475569">same missing work and next step</text>

    <rect x="617" y="412" width="186" height="38" rx="19" fill="#ecfeff"/>
    <text x="646" y="437" font-size="17" font-weight="700" fill="#0f766e">when each surface is live</text>

    <rect x="1092" y="84" width="206" height="34" rx="17" fill="#eef2ff"/>
    <text x="1125" y="106" font-size="16" font-weight="700" fill="#4f46e5">WHAT LEAVES THE THREAD</text>
    <text x="1125" y="172" font-size="42" font-weight="700" fill="#0f172a">Sendable output</text>
    <text x="1125" y="210" font-size="22" fill="#475569">artifact first, explanation attached</text>

    <rect x="1125" y="246" width="364" height="220" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <rect x="1153" y="278" width="140" height="30" rx="15" fill="#dbeafe"/>
    <text x="1181" y="298" font-size="15" font-weight="700" fill="#1d4ed8">SENDABLE FOLLOW-UP</text>
    <text x="1153" y="340" font-size="18" font-weight="700" fill="#0f172a">Owners, decisions, and open questions</text>
    <text x="1153" y="378" font-size="18" fill="#475569">Recommendation memo with tradeoffs still attached</text>
    <text x="1153" y="416" font-size="18" fill="#475569">Readiness check before the handoff gets risky</text>

    <rect x="1125" y="496" width="118" height="38" rx="19" fill="#1e293b"/>
    <text x="1156" y="521" font-size="17" font-weight="700" fill="#f8fafc">artifact first</text>

    <path d="M508 362 C540 362, 548 362, 585 362" stroke="url(#accentA)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1015 362 C1048 362, 1058 362, 1092 362" stroke="url(#accentB)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="548" cy="362" r="10" fill="#38bdf8"/>
    <circle cx="1058" cy="362" r="10" fill="#34d399"/>

    <rect x="88" y="660" width="310" height="24" rx="12" fill="url(#accentA)" opacity="0.85"/>
    <rect x="645" y="660" width="310" height="24" rx="12" fill="url(#accentB)" opacity="0.82"/>
    <rect x="1200" y="660" width="240" height="24" rx="12" fill="url(#accentC)" opacity="0.82"/>
  </g>
</svg>
