<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Jini decision panel illustration</title>
  <desc id="desc">An illustrated decision panel showing a recommendation memo, tradeoff table, and open questions that remain attached to the recommendation.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="74" width="1052" height="612" rx="32" fill="#ffffff"/>
    <rect x="116" y="128" width="420" height="470" rx="28" fill="url(#panel)"/>
    <rect x="584" y="128" width="494" height="470" rx="28" fill="#f8fbff" stroke="#dbeafe"/>

    <text x="148" y="184" font-size="18" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">BEFORE A DECISION</text>
    <text x="148" y="236" font-size="40" font-weight="700" fill="#f8fafc">Recommendation memo</text>
    <text x="148" y="276" font-size="22" fill="#cbd5e1">choose a direction without dropping the tradeoffs</text>

    <rect x="148" y="322" width="356" height="206" rx="24" fill="#020617" opacity="0.72"/>
    <text x="176" y="370" font-size="19" fill="#e2e8f0">recommended path: provider B</text>
    <text x="176" y="408" font-size="19" fill="#e2e8f0">why: faster handoff and cleaner audit trail</text>
    <text x="176" y="446" font-size="19" fill="#e2e8f0">risk: one pricing unknown still open</text>
    <text x="176" y="484" font-size="19" fill="#e2e8f0">next action: confirm contract term</text>

    <text x="618" y="184" font-size="18" font-weight="700" letter-spacing="1.4" fill="#4f46e5">WHAT STAYS ATTACHED</text>
    <text x="618" y="236" font-size="38" font-weight="700" fill="#0f172a">Reasoning you can still explain later</text>
    <text x="618" y="274" font-size="22" fill="#475569">The recommendation, its tradeoffs, and the unresolved questions should travel together.</text>

    <rect x="618" y="320" width="426" height="98" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="646" y="360" font-size="18" font-weight="700" fill="#0f172a">Tradeoff table</text>
    <text x="646" y="392" font-size="18" fill="#475569">cost, latency, risk, and support posture visible side by side</text>

    <rect x="618" y="444" width="426" height="98" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="646" y="484" font-size="18" font-weight="700" fill="#0f172a">Open questions</text>
    <text x="646" y="516" font-size="18" fill="#475569">what still needs a human answer before the recommendation becomes a commitment</text>

    <rect x="618" y="568" width="426" height="16" rx="8" fill="url(#accent)"/>
  </g>
</svg>
