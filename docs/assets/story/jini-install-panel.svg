<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Jini install panel illustration</title>
  <desc id="desc">An illustrated install-first panel showing a simple CLI start, environment checks, and the first useful artifact appearing quickly.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef8f4"/>
    </linearGradient>
    <linearGradient id="shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="74" width="1052" height="612" rx="32" fill="#ffffff"/>
    <rect x="116" y="128" width="468" height="470" rx="28" fill="url(#shell)"/>
    <rect x="636" y="128" width="442" height="470" rx="28" fill="#f8fbff" stroke="#dbeafe"/>

    <text x="148" y="184" font-size="18" font-weight="700" letter-spacing="1.4" fill="#93c5fd">INSTALL AND FIRST RUN</text>
    <text x="148" y="236" font-size="42" font-weight="700" fill="#f8fafc">Start with one command</text>
    <text x="148" y="274" font-size="22" fill="#cbd5e1">install, open Jini, and reach a first useful artifact fast</text>

    <rect x="148" y="314" width="404" height="178" rx="22" fill="#020617" opacity="0.7"/>
    <text x="176" y="356" font-size="18" fill="#94a3b8">$ jini</text>
    <text x="176" y="396" font-size="18" fill="#e2e8f0">provider check: ready</text>
    <text x="176" y="432" font-size="18" fill="#e2e8f0">local state folder: ready</text>
    <text x="176" y="468" font-size="18" fill="#e2e8f0">first artifact: follow-up draft opened</text>

    <rect x="148" y="524" width="198" height="38" rx="19" fill="#1d4ed8"/>
    <text x="181" y="549" font-size="17" font-weight="700" fill="#ffffff">works from the CLI today</text>

    <text x="668" y="184" font-size="18" font-weight="700" letter-spacing="1.4" fill="#1d4ed8">WHAT THE SURFACE PROVES</text>
    <text x="668" y="236" font-size="40" font-weight="700" fill="#0f172a">Useful result before command sprawl</text>
    <text x="668" y="274" font-size="22" fill="#475569">The install path should help the user reach a real artifact before teaching setup branches.</text>

    <rect x="668" y="320" width="378" height="94" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="696" y="360" font-size="18" font-weight="700" fill="#0f172a">Ready checks</text>
    <text x="696" y="392" font-size="18" fill="#475569">provider available, local storage visible, thread started</text>

    <rect x="668" y="438" width="378" height="94" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="696" y="478" font-size="18" font-weight="700" fill="#0f172a">First artifact</text>
    <text x="696" y="510" font-size="18" fill="#475569">follow-up, readiness check, or another sendable result</text>

    <rect x="668" y="556" width="378" height="18" rx="9" fill="url(#accent)"/>
  </g>
</svg>
