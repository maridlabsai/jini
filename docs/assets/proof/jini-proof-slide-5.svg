<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Jini proof slide about proof before payment</title>
  <desc id="desc">A diagram showing free orchestration first, measured savings before renewal, and a narrow paid boundary only when evidence exists.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="paid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="52" y="56" width="1176" height="608" rx="30" fill="#ffffff" opacity="0.72"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="94" y="118" font-size="22" font-weight="700" letter-spacing="1.7" fill="#0f766e">PROOF SLIDE 4</text>
    <text x="94" y="176" font-size="56" font-weight="700" fill="#0f172a">Proof before payment</text>
    <text x="94" y="222" font-size="26" fill="#475569">The paid layer should enter only after savings or continuity are measured.</text>

    <g filter="url(#shadow)">
      <rect x="92" y="286" width="320" height="250" rx="28" fill="#ffffff"/>
      <rect x="480" y="252" width="320" height="318" rx="28" fill="#ffffff"/>
      <rect x="868" y="286" width="320" height="250" rx="28" fill="#0f172a"/>
    </g>

    <text x="122" y="330" font-size="18" font-weight="700" letter-spacing="1.4" fill="#1d4ed8">FREE FIRST</text>
    <text x="122" y="376" font-size="34" font-weight="700" fill="#0f172a">Orchestrate</text>
    <text x="122" y="414" font-size="21" fill="#475569">usable artifacts, resumable state,</text>
    <text x="122" y="444" font-size="21" fill="#475569">visible route evidence</text>
    <rect x="122" y="476" width="158" height="34" rx="17" fill="#dbeafe"/>
    <text x="150" y="498" font-size="16" font-weight="700" fill="#1d4ed8">shell stays free</text>

    <text x="510" y="296" font-size="18" font-weight="700" letter-spacing="1.4" fill="#0f766e">MEASURE FIRST</text>
    <text x="510" y="344" font-size="34" font-weight="700" fill="#0f172a">Show evidence</text>
    <rect x="510" y="378" width="260" height="44" rx="22" fill="#ecfeff"/>
    <text x="536" y="406" font-size="19" font-weight="700" fill="#0f766e">month-to-date savings</text>
    <rect x="510" y="438" width="260" height="44" rx="22" fill="#eff6ff"/>
    <text x="536" y="466" font-size="19" font-weight="700" fill="#1d4ed8">provider headroom preserved</text>
    <rect x="510" y="498" width="260" height="44" rx="22" fill="#f0fdf4"/>
    <text x="536" y="526" font-size="19" font-weight="700" fill="#15803d">sessions resumed</text>

    <text x="898" y="330" font-size="18" font-weight="700" letter-spacing="1.4" fill="#93c5fd">ONLY AFTER PROOF</text>
    <text x="898" y="376" font-size="34" font-weight="700" fill="#f8fafc">Pay boundary</text>
    <text x="898" y="414" font-size="21" fill="#cbd5e1">trial first, renewal only when</text>
    <text x="898" y="444" font-size="21" fill="#cbd5e1">the evidence is real</text>
    <rect x="898" y="476" width="216" height="34" rx="17" fill="url(#paid)"/>
    <text x="939" y="498" font-size="16" font-weight="700" fill="#f8fafc">narrow paid layer</text>

    <path d="M412 408 C445 408, 452 408, 480 408" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M800 408 C833 408, 840 408, 868 408" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="446" cy="408" r="10" fill="#38bdf8"/>
    <circle cx="834" cy="408" r="10" fill="#2dd4bf"/>

    <rect x="94" y="612" width="1090" height="16" rx="8" fill="url(#paid)" opacity="0.9"/>
  </g>
</svg>
