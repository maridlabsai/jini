[package]
name = "jini-macos"
version = "0.1.0"
description = "Jini macOS desktop shell"
authors = ["Marid Labs AI"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "jini_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
