schema_version: "0.1.0"
updated_at: "2026-05-11"
adapters:
  - id: jira
    label: Jira
    layer: issue-system
    maturity: bridge-execute
    priority: 90
    publish_semantics:
      plan_serialization: serialized-idempotent
      bridge_execution: replay-safe
      receipt_contract: portable-json
    capabilities:
      - issues-export
      - issues-publish-plan
      - issues-execute-bridge
    contract: Canonical Tasks -> sync payload -> Jira issue bundle -> serialized publish plan

  - id: github
    label: GitHub Issues
    layer: issue-system
    maturity: native-execute
    priority: 60
    publish_semantics:
      plan_serialization: serialized-idempotent
      local_apply: deterministic-reapply
      native_execution: idempotent-upsert
      receipt_contract: portable-json
    capabilities:
      - issues-export
      - issues-publish-plan
      - issues-apply-local
      - issues-execute-native
    contract: Canonical Tasks -> sync payload -> GitHub issue bundle

